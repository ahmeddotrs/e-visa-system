[project]
name = "e-visa-system"
description = "Online visa processing and application management system."
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "bcrypt>=5.0.0",
  "email-validator>=2.3.0",
  "fastapi[standard]>=0.141.1",
  "passlib>=1.7.4",
  "pyjwt>=2.13.0",
  "python-multipart>=0.0.32",
  "sqlalchemy>=2.0.51",
  "sqlmodel>=0.0.39",
  "uvicorn>=0.52.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = ["ruff>=0.16.2"]
